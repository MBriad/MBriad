<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="A starry night sky with a crescent moon and dark hills with warm lit windows">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454A6B"/>
      <stop offset="100%" stop-color="#2E3250"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A5F82"/>
      <stop offset="100%" stop-color="#4C5173"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43496A"/>
      <stop offset="100%" stop-color="#383D5C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="58" r="2" opacity="0.8"/>
    <circle cx="205" cy="140" r="1.6" opacity="0.6"/>
    <circle cx="300" cy="70" r="1.8" opacity="0.75"/>
    <circle cx="395" cy="150" r="1.5" opacity="0.55"/>
    <circle cx="470" cy="52" r="2.2" opacity="0.85"/>
    <circle cx="545" cy="120" r="1.5" opacity="0.6"/>
    <circle cx="640" cy="62" r="1.8" opacity="0.7"/>
    <circle cx="700" cy="150" r="1.5" opacity="0.5"/>
    <circle cx="800" cy="55" r="2" opacity="0.8"/>
    <circle cx="880" cy="170" r="1.6" opacity="0.55"/>
    <circle cx="950" cy="200" r="1.5" opacity="0.5"/>
    <circle cx="1150" cy="150" r="1.8" opacity="0.7"/>
    <circle cx="60" cy="190" r="1.5" opacity="0.5"/>
  </g>
  <!-- twinkling cross stars -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M240 92 h9 M244.5 87.5 v9"/>
    <path d="M690 96 h9 M694.5 91.5 v9"/>
    <path d="M1085 110 h9 M1089.5 105.5 v9"/>
  </g>

  <!-- crescent moon -->
  <circle cx="1005" cy="96" r="42" fill="#F4EFD8"/>
  <circle cx="982" cy="82" r="38" fill="#3B3F5E"/>

  <!-- hills -->
  <path d="M0 300 Q180 230 380 270 T800 255 T1200 268 V320 H0 Z" fill="url(#hillBack)"/>
  <path d="M0 320 Q220 255 460 298 T900 290 T1200 302 V320 H0 Z" fill="url(#hillFront)"/>

  <!-- warm windows -->
  <g fill="#FFD9A0">
    <rect x="240" y="281" width="6" height="7" rx="1.5" opacity="0.9"/>
    <rect x="760" y="287" width="6" height="7" rx="1.5" opacity="0.85"/>
    <rect x="1000" y="285" width="6" height="7" rx="1.5" opacity="0.9"/>
  </g>
</svg>
